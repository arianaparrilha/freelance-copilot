<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fiscal Copilot — Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../style.css"/>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:var(--font)}

  .auth-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--rlg);
    box-shadow:var(--sh-lg);
    padding:40px;
    width:100%;
    max-width:400px;
  }

  .auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:32px}
  .auth-logo .logo-mark{width:36px;height:36px;border-radius:9px;background:var(--blue);color:#fff;font-family:var(--font-heading);font-weight:var(--fw-bold);font-size:var(--text-lg);display:flex;align-items:center;justify-content:center}
  .auth-logo .logo-name{font-family:var(--font-heading);font-weight:var(--fw-semibold);font-size:var(--text-md);color:var(--t1)}

  .auth-title{font-family:var(--font-heading);font-size:var(--text-xl);font-weight:var(--fw-semibold);color:var(--t1);margin:0 0 6px}
  .auth-sub{font-size:var(--text-sm);color:var(--t3);margin:0 0 28px}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:var(--text-sm);font-weight:var(--fw-medium);color:var(--t2);margin-bottom:6px}
  .field input{
    width:100%;
    box-sizing:border-box;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:var(--rsm);
    font-family:var(--font);
    font-size:var(--text-base);
    color:var(--t1);
    background:var(--surface);
    outline:none;
    transition:border-color .15s;
  }
  .field input:focus{border-color:var(--blue)}

  .auth-btn{
    width:100%;
    padding:11px;
    background:var(--blue);
    color:#fff;
    border:none;
    border-radius:var(--rsm);
    font-family:var(--font-heading);
    font-size:var(--text-base);
    font-weight:var(--fw-semibold);
    cursor:pointer;
    margin-top:8px;
    transition:background .15s;
  }
  .auth-btn:hover{background:var(--blue-dk)}
  .auth-btn:disabled{opacity:.6;cursor:not-allowed}

  .auth-error{
    background:var(--red-lt);
    color:var(--red);
    border-radius:var(--rsm);
    padding:10px 12px;
    font-size:var(--text-sm);
    margin-top:16px;
    display:none;
  }
  .auth-error.visible{display:block}

  .auth-success{
    background:var(--green-lt);
    color:var(--green);
    border-radius:var(--rsm);
    padding:10px 12px;
    font-size:var(--text-sm);
    margin-top:16px;
    display:none;
  }
  .auth-success.visible{display:block}

  .auth-toggle{text-align:center;margin-top:24px;font-size:var(--text-sm);color:var(--t3)}
  .auth-toggle a{color:var(--blue);text-decoration:none;font-weight:var(--fw-medium);cursor:pointer}
  .auth-toggle a:hover{text-decoration:underline}

  .auth-divider{display:flex;align-items:center;gap:12px;margin:20px 0;font-size:var(--text-sm);color:var(--t3)}
  .auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}

  .auth-btn-ghost{
    width:100%;
    padding:11px;
    background:transparent;
    color:var(--t2);
    border:1px solid var(--border);
    border-radius:var(--rsm);
    font-family:var(--font-heading);
    font-size:var(--text-base);
    font-weight:var(--fw-semibold);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:background .15s, border-color .15s, color .15s;
  }
  .auth-btn-ghost:hover{background:var(--bg);border-color:var(--border2);color:var(--t1)}
  .auth-btn-ghost:disabled{opacity:.6;cursor:not-allowed}
</style>
</head>
<body>

<div class="auth-card">
  <div class="auth-logo">
    <div class="logo-mark">F</div>
    <span class="logo-name">Fiscal Copilot</span>
  </div>

  <h1 class="auth-title" id="auth-title">Bem-vindo de volta</h1>
  <p class="auth-sub" id="auth-sub">Entra na tua conta para continuar.</p>

  <form id="auth-form">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="o.teu@email.com" required/>
    </div>
    <div class="field">
      <label for="password">Palavra-passe</label>
      <input type="password" id="password" placeholder="••••••••" required/>
    </div>
    <button type="submit" class="auth-btn" id="auth-btn">Entrar</button>
  </form>

  <div class="auth-error" id="auth-error"></div>
  <div class="auth-success" id="auth-success"></div>

  <div class="auth-divider">ou</div>
  <button type="button" class="auth-btn-ghost" id="demo-btn" onclick="loginAsGuest()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    Explorar como visitante
  </button>

  <!-- auth-toggle disabled — registration closed for now
  <div class="auth-toggle">
    <span id="toggle-text">Não tens conta?</span>
    <a id="toggle-link"> Criar conta</a>
  </div>
  -->
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-client.js"></script>
<script>
  const form = document.getElementById('auth-form')
  const btn = document.getElementById('auth-btn')
  const errorEl = document.getElementById('auth-error')
  const successEl = document.getElementById('auth-success')

  /* registration disabled for now — toggle logic kept for future use
  let mode = 'login'
  const toggleLink = document.getElementById('toggle-link')
  const toggleText = document.getElementById('toggle-text')
  const title = document.getElementById('auth-title')
  const sub = document.getElementById('auth-sub')
  toggleLink.addEventListener('click', () => { ... })
  */

  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    const email = document.getElementById('email').value
    const password = document.getElementById('password').value

    btn.disabled = true
    btn.textContent = 'A entrar...'
    errorEl.classList.remove('visible')
    successEl.classList.remove('visible')

    const { error } = await db.auth.signInWithPassword({ email, password })

    if (error) {
      errorEl.textContent = translateError(error.message)
      errorEl.classList.add('visible')
      btn.disabled = false
      btn.textContent = 'Entrar'
    } else {
      window.location.href = '/'
    }
  })

  function translateError(msg) {
    if (msg.includes('Invalid login credentials')) return 'Email ou palavra-passe incorretos.'
    if (msg.includes('Email not confirmed')) return 'Confirma o teu email antes de entrar.'
    if (msg.includes('User already registered')) return 'Este email já tem uma conta.'
    if (msg.includes('Password should be')) return 'A palavra-passe deve ter pelo menos 6 caracteres.'
    return 'Ocorreu um erro. Tenta novamente.'
  }

  async function loginAsGuest() {
    const demoBtn = document.getElementById('demo-btn')
    demoBtn.disabled = true
    demoBtn.innerHTML = 'A entrar...'
    errorEl.classList.remove('visible')

    const res = await fetch('/.netlify/functions/demo-login')
    const json = await res.json()

    if (!res.ok || json.error || !json.session) {
      errorEl.textContent = 'Modo visitante indisponível. Tenta mais tarde.'
      errorEl.classList.add('visible')
      demoBtn.disabled = false
      demoBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Explorar como visitante'
      return
    }

    await db.auth.setSession(json.session)
    window.location.href = '/'
  }

  db.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = '/'
  })
</script>
</body>
</html>
